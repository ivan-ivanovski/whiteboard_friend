<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="penGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background container -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>

  <!-- Inner Whiteboard Canvas Frame -->
  <g filter="url(#shadow)">
    <rect x="76" y="86" width="360" height="260" rx="24" fill="#FFFFFF"/>
    <!-- Grid dots on miniature board -->
    <circle cx="120" cy="130" r="4" fill="#CBD5E1"/>
    <circle cx="180" cy="130" r="4" fill="#CBD5E1"/>
    <circle cx="240" cy="130" r="4" fill="#CBD5E1"/>
    <circle cx="300" cy="130" r="4" fill="#CBD5E1"/>
    <circle cx="360" cy="130" r="4" fill="#CBD5E1"/>

    <circle cx="120" cy="180" r="4" fill="#CBD5E1"/>
    <circle cx="180" cy="180" r="4" fill="#CBD5E1"/>
    <circle cx="240" cy="180" r="4" fill="#CBD5E1"/>
    <circle cx="300" cy="180" r="4" fill="#CBD5E1"/>
    <circle cx="360" cy="180" r="4" fill="#CBD5E1"/>

    <circle cx="120" cy="230" r="4" fill="#CBD5E1"/>
    <circle cx="180" cy="230" r="4" fill="#CBD5E1"/>
    <circle cx="240" cy="230" r="4" fill="#CBD5E1"/>
    <circle cx="300" cy="230" r="4" fill="#CBD5E1"/>
    <circle cx="360" cy="230" r="4" fill="#CBD5E1"/>

    <!-- Yellow Sticky Note on Board -->
    <rect x="110" y="150" width="85" height="85" rx="8" fill="#FEF08A" transform="rotate(-4 152 192)"/>
    <rect x="122" y="165" width="55" height="6" rx="3" fill="#EAB308" transform="rotate(-4 152 192)"/>
    <rect x="122" y="180" width="40" height="4" rx="2" fill="#CA8A04" transform="rotate(-4 152 192)"/>

    <!-- Dynamic Inking Stroke on Board -->
    <path d="M 230 240 Q 280 160 340 180 T 380 230" fill="none" stroke="#6366F1" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Stylus / Digital Pen across foreground -->
  <g filter="url(#shadow)" transform="translate(190, 210) rotate(-42)">
    <!-- Pen Barrel -->
    <rect x="40" y="8" width="180" height="24" rx="6" fill="#F8FAFC"/>
    <rect x="180" y="6" width="30" height="28" rx="4" fill="#E2E8F0"/>
    <rect x="80" y="8" width="40" height="24" fill="url(#penGrad)"/>
    <!-- Pen Tip -->
    <polygon points="40,8 10,20 40,32" fill="#0F172A"/>
    <circle cx="10" cy="20" r="3" fill="#6366F1"/>
  </g>
</svg>
